<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101a2e">
<title>Anzug Manager Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#101a2e;
  --primary-2:#1c2c4a;
  --accent:#ff6a1f;
  --accent-dim:#ffe2cf;
  --bg:#eef1f6;
  --surface:#ffffff;
  --surface-alt:#f5f7fa;
  --ink:#101820;
  --sub:#5b6472;
  --border:#e2e6ed;
  --success:#189267;
  --danger:#e0473d;
  --warn:#eeb229;
  --caution:#d35400;
  --radius:16px;
  --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:
    linear-gradient(var(--bg),var(--bg)) fixed,
    repeating-linear-gradient(0deg, rgba(16,26,46,.035) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(16,26,46,.035) 0 1px, transparent 1px 26px);
  color:var(--ink);
  margin:0;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(18px + var(--safe-b));
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}

/* ---------- App shell ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(160deg,var(--primary) 0%, var(--primary-2) 100%);
  padding:calc(12px + var(--safe-t)) 16px 12px;
  color:#fff;
  box-shadow:0 6px 18px -8px rgba(16,26,46,.55);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex:none;
  background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px -2px rgba(255,106,31,.6);
}
.brand-mark svg{width:19px; height:19px;}
.brand-text{min-width:0;}
.brand-title{font-weight:800; font-size:15.5px; letter-spacing:.2px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,.55); font-weight:500; letter-spacing:.4px; text-transform:uppercase; display:flex; align-items:center; gap:5px;}
.save-dot{width:5px;height:5px;border-radius:50%;background:#7fe0b3; opacity:.35; transition:opacity .25s;}
.save-dot.flash{opacity:1; animation:pulse-dot 1.1s ease-out;}
@keyframes pulse-dot{0%{opacity:1; transform:scale(1.6);} 100%{opacity:.35; transform:scale(1);}}

.icon-btn{
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);
  color:#fff; padding:9px 12px; border-radius:11px;
  font-weight:600; font-size:12.5px; cursor:pointer;
  transition:transform .12s, background .15s;
  white-space:nowrap;
}
.icon-btn svg{width:15px; height:15px; flex:none;}
.icon-btn:active{transform:scale(.94);}
.icon-btn.solid{background:var(--accent); border-color:transparent;}
.icon-btn.solid:active{background:#e85e17;}
.header-actions{display:flex; gap:8px;}

/* Segmented tab bar */
.tabbar-wrap{
  position:sticky; top:calc(58px + var(--safe-t)); z-index:29;
  background:var(--bg);
  padding:10px 12px 8px;
  border-bottom:1px solid var(--border);
}
.tabbar{
  display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab-chip{
  flex:none; display:flex; align-items:center;
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; overflow:hidden;
  transition:border-color .15s, background .15s;
}
.tab-chip.active{background:var(--primary); border-color:var(--primary);}
.tab-btn{
  background:none; border:none; padding:9px 6px 9px 13px;
  font-weight:600; font-size:12.5px; color:var(--ink);
  cursor:pointer; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tab-chip.active .tab-btn{color:#fff;}
.tab-del{
  background:none; border:none; color:var(--sub); opacity:.55;
  padding:6px 10px 6px 4px; cursor:pointer; font-size:15px; line-height:1;
}
.tab-chip.active .tab-del{color:#fff; opacity:.55;}
.tab-del:active{opacity:1;}

/* Suit (Anzug) bar per athlete */
.suitbar-wrap{margin:0 0 12px; display:none;}
.suitbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
.suitbar::-webkit-scrollbar{display:none;}
.suit-chip{
  flex:none; display:flex; align-items:center;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:11px; overflow:hidden; transition:border-color .15s, background .15s;
}
.suit-chip.active{background:var(--accent); border-color:var(--accent);}
.suit-btn{background:none; border:none; padding:8px 12px; font-weight:700; font-size:12px; color:var(--ink); cursor:pointer; white-space:nowrap;}
.suit-chip.active .suit-btn{color:#fff;}
.suit-del{background:none; border:none; color:var(--sub); opacity:.55; padding:6px 9px 6px 2px; cursor:pointer; font-size:14px; line-height:1;}
.suit-chip.active .suit-del{color:#fff; opacity:.6;}
.suit-del:active{opacity:1;}
.suit-add{
  flex:none; display:flex; align-items:center; gap:4px;
  background:var(--surface-alt); border:1.5px dashed #c7ced9; border-radius:11px;
  padding:8px 12px; font-weight:700; font-size:12px; color:var(--sub); cursor:pointer; white-space:nowrap;
}
.suit-add:active{background:var(--border);}

main{padding:14px 12px 90px;}

.backup-banner{
  display:none; align-items:center; gap:10px; margin:0 0 14px; padding:11px 14px;
  border-radius:12px; background:#fff4e9; border:1.5px solid #ffd9b0; color:#9a4b0a;
}
.backup-banner.show{display:flex;}
.backup-banner svg{width:18px; height:18px; flex:none;}
.backup-banner-text{flex:1; font-size:12px; font-weight:600; line-height:1.4;}
.backup-banner-actions{display:flex; align-items:center; gap:4px; flex:none;}
.backup-banner-btn{background:var(--accent); color:#fff; border:none; padding:8px 12px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap;}
.backup-banner-btn:active{background:#e85e17;}
.backup-banner-close{background:none; border:none; color:#9a4b0a; opacity:.6; font-size:19px; line-height:1; padding:2px 6px; cursor:pointer;}
.backup-banner-close:active{opacity:1;}
@media (max-width:480px){ .backup-banner{flex-wrap:wrap;} .backup-banner-actions{margin-left:28px;} }

.app-footer{
  text-align:center; font-size:10.5px; font-weight:500; color:var(--sub);
  opacity:.5; letter-spacing:.2px; padding:22px 12px 4px;
}

.content{display:none;}
.content.active{display:block;}

/* ---------- Empty state ---------- */
.empty-state{
  text-align:center; padding:56px 24px; color:var(--sub);
}
.empty-icon{
  width:56px; height:56px; margin:0 auto 14px; border-radius:16px;
  background:var(--surface); border:1.5px dashed #c7ced9;
  display:flex; align-items:center; justify-content:center;
}
.empty-icon svg{width:26px; height:26px; color:#9aa4b2;}
.empty-state h3{margin:0 0 6px; font-size:15px; color:var(--ink);}
.empty-state p{margin:0 0 18px; font-size:12.5px;}
.empty-cta{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--accent); color:#fff; border:none;
  padding:11px 18px; border-radius:12px; font-weight:700; font-size:13px;
  cursor:pointer;
}
.empty-cta svg{width:15px;height:15px;}

/* ---------- Card / protocol ---------- */
.main-card{
  position:relative;
  background:var(--surface);
  border-radius:var(--radius);
  padding:20px 18px 18px;
  box-shadow:0 1px 2px rgba(16,26,46,.04), 0 10px 28px -18px rgba(16,26,46,.35);
  border:1px solid var(--border);
}
.main-card::before,.main-card::after,.corner-tl,.corner-br{content:"";}
.frame-corner{position:absolute; width:16px; height:16px; border-color:var(--accent); pointer-events:none;}
.fc-tl{top:-1px; left:-1px; border-top:2.5px solid var(--accent); border-left:2.5px solid var(--accent); border-radius:6px 0 0 0;}
.fc-br{bottom:-1px; right:-1px; border-bottom:2.5px solid var(--accent); border-right:2.5px solid var(--accent); border-radius:0 0 6px 0;}

.gender-ribbon{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
  padding:5px 13px; border-radius:20px; margin-bottom:12px;
}
.gender-ribbon.gender-damen{background:#fde4ef; color:#c2185b;}
.gender-ribbon.gender-herren{background:#e3edfb; color:#1d4ed8;}

.sheet-title{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin:0 0 14px; padding-bottom:12px; border-bottom:1.5px solid var(--surface-alt);
}
.sheet-title h2{margin:0; font-size:16.5px; font-weight:800; color:var(--primary);}
.sheet-title .eyebrow{
  font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--accent);
}
.athlete-name{display:block; font-size:17px;}

.title-meta{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
.title-field{display:flex; flex-direction:column; gap:4px; min-width:108px;}
.title-remark{flex:1 1 160px; max-width:220px;}
.remark-label{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--sub);}
.title-field input, .status-select{
  font-size:12.5px; padding:7px 9px; height:32px; font-weight:500;
  border:1.5px solid var(--border); border-radius:8px; background:var(--surface); font-family:inherit;
}
.status-select{font-weight:800; cursor:pointer; appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b6472' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat; background-position:right 7px center; background-size:13px; padding-right:24px;
}
.status-select.status-progress{background-color:var(--surface-alt); color:var(--sub); border-color:var(--border);}
.status-select.status-approved{background-color:#e3f6ee; color:var(--success); border-color:#b7e8d3;}
.status-select.status-rework{background-color:#fde2df; color:var(--danger); border-color:#f6b8b2;}

.suit-status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:1px; flex:none;}
.status-dot-progress{background:#b9c2cf;}
.status-dot-approved{background:var(--success);}
.status-dot-rework{background:var(--danger);}

.protocol-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px;}
@media (max-width:850px){.protocol-grid{grid-template-columns:1fr;}}

.cat-header{
  display:flex; align-items:center; gap:7px;
  background:var(--surface-alt); padding:8px 11px; border-radius:9px;
  margin:16px 0 8px; border-left:3px solid var(--accent);
  font-size:11.5px; font-weight:700; color:var(--primary); letter-spacing:.2px;
}
.cat-header:first-child{margin-top:0;}
.cat-header .cnt{
  margin-left:auto; font-size:9.5px; font-weight:700; color:var(--sub);
  background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px 7px;
}

.master-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 12px;}
.master-box{
  border:1.5px solid var(--border); border-radius:11px; padding:8px 10px;
  background:var(--surface-alt); display:flex; flex-direction:column; gap:5px;
}
.master-label{font-size:9.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--primary);}
.master-box input{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14.5px; height:34px;}

.add-row-btn{
  display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
  margin-top:8px; padding:9px; border-radius:10px; border:1.5px dashed #c7ced9;
  background:var(--surface-alt); color:var(--sub); font-weight:700; font-size:11.5px; cursor:pointer;
}
.add-row-btn svg{width:14px; height:14px; flex:none;}
.add-row-btn:active{background:var(--border);}
.add-row-group{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.add-row-group .add-row-btn{flex:1 1 140px; margin-top:0;}
.tol-badge{font-size:9px; font-weight:800; color:var(--accent); background:var(--accent-dim); padding:2px 6px; border-radius:20px; margin-left:2px;}

.row-del{
  background:none; border:none; color:var(--sub); opacity:.5; font-size:15px; line-height:1;
  padding:2px 4px; cursor:pointer; margin-left:auto; flex:none;
}
.row-del:active{opacity:1; color:var(--danger);}

.table-scroll{overflow-x:auto; border-radius:10px; -webkit-overflow-scrolling:touch;}
table{width:100%; border-collapse:collapse; table-layout:fixed; min-width:460px;}
th{
  background:var(--surface-alt); padding:7px 4px; font-size:9.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.3px; color:var(--sub);
  border-bottom:1.5px solid var(--border); text-align:center;
}
td{padding:5px 4px; border-bottom:1px solid var(--surface-alt); text-align:center; vertical-align:middle;}
tr:last-child td{border-bottom:none;}

.w-name{width:36%; text-align:left; font-weight:700; font-size:12px; color:var(--ink);}
.name-flex{display:flex; align-items:center; gap:4px; min-height:32px;}

.cm-input{
  width:30px; height:30px; border:1.5px solid var(--border); border-radius:7px;
  font-size:12px; text-align:center; font-weight:700; background:var(--surface-alt);
}
.cm-label{font-size:9.5px; font-weight:500; color:var(--sub); margin-left:1px;}

.lr-flex{display:flex; gap:3px; justify-content:center; align-items:center;}
.lr-input-box{display:flex; flex-direction:column; align-items:center; gap:2px; width:50%;}
.lr-input-box span{font-size:8.5px; font-weight:700; color:var(--sub);}

input[type="text"]{
  width:100%; padding:8px 3px; border:1.5px solid var(--border); border-radius:8px;
  text-align:center; font-size:13.5px; font-weight:600; background:var(--surface);
  transition:border-color .15s, box-shadow .15s;
}
input[type="text"]:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
td input[type="text"]{font-family:'IBM Plex Mono',monospace; font-weight:600;}

.diff-tag{
  display:block; padding:7px 0; border-radius:8px; font-weight:700; font-size:12px;
  background:var(--surface-alt); border:1px solid var(--border); color:var(--sub);
  font-family:'IBM Plex Mono',monospace;
}
.status-ok{background:var(--success) !important; color:#fff; border-color:transparent;}
.status-bad{background:var(--danger) !important; color:#fff; border-color:transparent;}
.status-warn{background:var(--warn) !important; color:#1a1400; border-color:transparent;}
.status-orange{background:var(--caution) !important; color:#fff; border-color:transparent;}

.air-section{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.air-box{
  border:1.5px solid var(--border); padding:10px 8px; border-radius:11px; text-align:center;
  background:var(--surface-alt);
}
.air-box .air-label{font-size:10.5px; font-weight:800; color:var(--primary); letter-spacing:.3px;}
.air-inputs{display:flex; gap:5px; margin-top:7px;}
.air-inputs input{font-weight:700; font-size:16px; height:40px; font-family:'IBM Plex Mono',monospace;}

.check-list{background:var(--surface-alt); padding:10px; border-radius:11px; border:1px solid var(--border);}
.th-controls{margin-left:auto; display:flex; gap:6px;}
.mini-btn{
  font-size:9.5px; font-weight:700; padding:4px 9px; border-radius:20px;
  border:1px solid var(--border); background:var(--surface); color:var(--sub); cursor:pointer;
}
.mini-btn:active{background:var(--border);}
.mini-btn.toggle-btn{width:22px; height:22px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1; font-weight:800;}

.sketch-section{grid-column:1/-1; margin-top:6px; padding-top:16px; border-top:1.5px solid var(--surface-alt);}
.sketch-toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:4px 0 10px;}
.sketch-colors{display:flex; gap:7px;}
.sketch-color{
  width:26px; height:26px; border-radius:50%; border:2.5px solid transparent; cursor:pointer;
  background:var(--sc); box-shadow:0 0 0 1px var(--border) inset; padding:0;
}
.sketch-color.active{border-color:var(--primary); box-shadow:0 0 0 2px #fff inset, 0 0 0 3px var(--primary);}
.sketch-modes{display:flex; gap:6px; flex-wrap:wrap;}
.sketch-mode-btn{
  display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:7px 11px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface);
  color:var(--sub); cursor:pointer;
}
.sketch-mode-btn svg{width:14px; height:14px; flex:none;}
.sketch-mode-btn.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.sketch-canvas-wrap{
  position:relative; width:100%; border-radius:12px; overflow:hidden;
  border:1.5px solid var(--border); background:#fff; touch-action:none;
}
.sketch-bg{display:block; width:100%; height:auto; pointer-events:none; user-select:none;}
.sketch-canvas{position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair;}
.sketch-canvas-wrap.pin-mode .sketch-canvas{cursor:copy;}
.sketch-pins{position:absolute; inset:0; pointer-events:none;}
.sketch-pin{
  position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
  width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff;
  border:2px solid #fff; box-shadow:0 2px 6px rgba(16,26,46,.4);
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;
  cursor:grab; padding:0; touch-action:none;
}
.sketch-pin:active{background:#e85e17; cursor:grabbing;}
.sketch-marker-list{margin-top:10px; display:flex; flex-direction:column; gap:5px;}
.sketch-marker-row{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px;
  background:var(--surface-alt); border:1px solid var(--border); cursor:pointer;
}
.sketch-marker-row:active{background:var(--border);}
.sketch-marker-num{
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:10px; font-weight:800; flex:none; display:flex; align-items:center; justify-content:center;
}
.sketch-marker-text{flex:1; font-size:12.5px; font-weight:600; color:var(--ink);}
.sketch-marker-empty{font-size:12px; color:var(--sub); text-align:center; padding:8px 0;}
.check-item{
  display:flex; align-items:center; gap:9px; padding:7px 4px; font-size:12.5px; font-weight:500;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{
  width:18px; height:18px; accent-color:var(--accent); flex:none; cursor:pointer;
}
textarea{
  width:100%; min-height:64px; margin-top:10px; padding:10px; border-radius:11px;
  border:1.5px solid var(--border); font-size:13px; resize:vertical; background:var(--surface);
}
textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(12,18,32,.5); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center; z-index:80;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.modal-overlay.show{opacity:1; pointer-events:auto;}
@media (min-width:560px){.modal-overlay{align-items:center;}}
.modal-box{
  background:var(--surface); width:100%; max-width:420px;
  border-radius:20px 20px 0 0; padding:22px 20px calc(20px + var(--safe-b));
  transform:translateY(16px); transition:transform .2s;
  box-shadow:0 -10px 40px rgba(16,26,46,.25);
}
@media (min-width:560px){.modal-box{border-radius:18px; margin:0 16px;}}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-icon{
  width:40px; height:40px; border-radius:11px; background:var(--accent-dim);
  display:flex; align-items:center; justify-content:center; margin-bottom:12px;
}
.modal-icon svg{width:20px; height:20px; color:var(--accent);}
.modal-icon.danger{background:#fde2df;}
.modal-icon.danger svg{color:var(--danger);}
.modal-box h3{margin:0 0 5px; font-size:16.5px; font-weight:800; color:var(--ink);}
.modal-box p{margin:0 0 16px; font-size:12.5px; color:var(--sub); line-height:1.5;}
.modal-box input[type="text"]{
  text-align:left; font-size:15px; padding:12px 13px; margin-bottom:6px;
}
.modal-err{color:var(--danger); font-size:11.5px; font-weight:600; min-height:16px; margin-bottom:6px;}
.modal-actions{display:flex; gap:9px; margin-top:14px;}
.modal-actions button{
  flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:13.5px; cursor:pointer;
}
.btn-cancel{background:var(--surface-alt); color:var(--ink); border:1.5px solid var(--border) !important;}
.btn-cancel:active{background:var(--border);}
.btn-confirm{background:var(--accent); color:#fff;}
.btn-confirm:active{background:#e85e17;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:active{background:#c73c33;}

.btn-gender{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:16px 12px; border-radius:14px; border:1.5px solid transparent;
  font-weight:800; font-size:13.5px; cursor:pointer;
}
.btn-gender svg{width:22px; height:22px;}
.btn-gender-damen{background:#fde4ef; color:#c2185b; border-color:#f8c6dd;}
.btn-gender-damen:active{background:#fbd2e6;}
.btn-gender-herren{background:#e3edfb; color:#1d4ed8; border-color:#c3d8f7;}
.btn-gender-herren:active{background:#cfe1f9;}

.roster-section{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
.roster-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); margin-bottom:8px;}
.roster-search{
  width:100%; padding:9px 12px; margin-bottom:9px; border-radius:10px;
  border:1.5px solid var(--border); font-size:13px; text-align:left; background:var(--surface-alt);
}
.roster-search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
.roster-list{max-height:216px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; -webkit-overflow-scrolling:touch;}
.roster-item{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:11px;
  background:var(--surface-alt); border:1px solid var(--border); cursor:pointer;
}
.roster-item:active{background:var(--border);}
.ri-avatar{
  width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; flex:none;
}
.ri-name{flex:1; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ri-del{background:none; border:none; color:var(--sub); opacity:.45; font-size:16px; line-height:1; padding:2px 5px; cursor:pointer; flex:none;}
.ri-del:active{opacity:1; color:var(--danger);}
.roster-empty{font-size:12px; color:var(--sub); text-align:center; padding:8px 0;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(18px + var(--safe-b)); transform:translate(-50%,14px);
  background:var(--primary); color:#fff; padding:11px 18px; border-radius:12px;
  font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 22px -8px rgba(16,26,46,.5); z-index:90;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast svg{width:15px; height:15px; color:#7fe0b3; flex:none;}
.toast.show{opacity:1; transform:translate(-50%,0);}

@media print{
  .no-print, .suitbar-wrap, .app-footer, .modal-overlay, .toast{display:none !important;}
  body{background:none !important; padding:0 !important;}
  main{padding:0 !important;}
  .main-card{box-shadow:none !important; border:none !important;}
  .frame-corner{display:none !important;}
  .add-row-btn, .row-del{display:none !important;}
  .sketch-toolbar, .mini-btn, .ri-del{display:none !important;}
  .air-section, .check-list, .sketch-body{display:block !important;}
  .protocol-grid{grid-template-columns:1fr !important;}
  @page{ size: A4 portrait; margin:10mm; }
}
</style>
</head>

<main>

    <span class="backup-banner-text" id="backupBannerText"></span>

    </div>
  </div>
  <div class="suitbar-wrap" id="suitbarWrap">
    <div class="suitbar" id="suitList"></div>
  </div>
  <div id="sheetsContainer"></div>
  <div class="app-footer">© Florian Aichinger · DSV</div>
</main>

</div>

</div>

/* ---------- persistence ---------- */
function save() {
    const data = [];
    document.querySelectorAll('.content').forEach(c => {
        const id = c.id;
        const dateInput = document.getElementById('date_'+id);
        const obj = { id: id, name: c.dataset.athleteName, suit: c.dataset.suit, gender: c.dataset.gender || 'damen', status: c.dataset.status || 'progress', date: dateInput ? dateInput.value : '', techHidden: c.dataset.techHidden === '1', sketchHidden: c.dataset.sketchHidden === '1', airHidden: c.dataset.airHidden === '1', inputs: {}, checks: [], notes: c.querySelector('textarea').value, customRows: [] };
        c.querySelectorAll('input[type="text"]').forEach(i => { if(i.id) obj.inputs[i.id] = i.value; });
        c.querySelectorAll('input[type="checkbox"]').forEach((ch, idx) => { if(ch.checked) obj.checks.push(idx); });
        c.querySelectorAll('tr.custom-row').forEach(tr => { obj.customRows.push({ id: tr.dataset.rowId, tol: tr.dataset.tol || '2-5' }); });
        obj.sketch = sketchData[id] ? { strokes: sketchData[id].strokes, markers: sketchData[id].markers } : { strokes: [], markers: [] };
        data.push(obj);
    });
    localStorage.setItem('anzugDataLR_v16', JSON.stringify(data));
    flashSaved();
    checkBackupReminder();
}

function flashSaved(){
    const dot = document.getElementById('saveDot');
    const label = document.getElementById('saveLabel');
    dot.classList.remove('flash'); void dot.offsetWidth; dot.classList.add('flash');
    label.textContent = 'Gespeichert';
    clearTimeout(saveFlashTimer);
    saveFlashTimer = setTimeout(()=>{ label.textContent = 'Messprotokoll'; }, 1500);
}

function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}

            </button>
            <button class="btn-cancel" onclick="triggerImportPicker()">

function openSelectExportModal(){
    const box = document.getElementById('modalBox');
    const seen = new Set();
    const athletes = [];
    document.querySelectorAll('.content').forEach(c => {
        const key = c.dataset.athleteKey;
        if(!seen.has(key)){ seen.add(key); athletes.push({ key: key, name: c.dataset.athleteName }); }
    });
    athletes.sort((a,b)=>a.name.localeCompare(b.name,'de'));

    box.innerHTML = `
        <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 10-16 0"/><circle cx="12" cy="7" r="4"/></svg></div>
        <h3>Athleten auswählen</h3>
        <p>Wähle, welche Athleten (mit all ihren Anzug-Protokollen) exportiert werden sollen.</p>
        <div class="roster-list" id="exportAthleteList" style="max-height:260px;"></div>
        <div class="modal-err" id="exportSelErr"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="openBackupModal()">Zurück</button>
            <button class="btn-confirm" onclick="exportSelectedAthletes()">Exportieren</button>
        </div>`;

    const listEl = document.getElementById('exportAthleteList');
    if(!athletes.length){
        listEl.innerHTML = '<div class="roster-empty">Keine Athleten vorhanden.</div>';
    } else {
        athletes.forEach(a => {
            const item = document.createElement('label');
            item.className = 'roster-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.value = a.key; cb.className = 'export-athlete-cb';
            cb.style.cssText = 'width:18px;height:18px;accent-color:var(--accent);flex:none;margin-right:2px;';
            const avatar = document.createElement('span');
            avatar.className = 'ri-avatar'; avatar.textContent = initialsOf(a.name);
            const nameEl = document.createElement('span');
            nameEl.className = 'ri-name'; nameEl.textContent = a.name;
            item.appendChild(cb); item.appendChild(avatar); item.appendChild(nameEl);
            listEl.appendChild(item);
        });
    }
    openModal();
}

function exportSelectedAthletes(){
    const checked = Array.from(document.querySelectorAll('.export-athlete-cb:checked')).map(cb => cb.value);
    if(!checked.length){
        const err = document.getElementById('exportSelErr');
        if(err) err.textContent = 'Bitte mindestens einen Athleten wählen.';
        return;
    }
    const keySet = new Set(checked);
    const allSheets = JSON.parse(localStorage.getItem(DATA_KEY)) || [];
    const filteredSheets = allSheets.filter(s => keySet.has(athleteKey(s.name)));
    const names = [...new Set(filteredSheets.map(s => s.name))];

    const payload = {
        app: 'AnzugManagerPro',
        version: 1,
        exportedAt: new Date().toISOString(),
        sheets: filteredSheets,
        roster: names
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    const label = names.length === 1 ? safeFileSegment(names[0]) : `${names.length}_Athleten`;
    a.href = url;
    a.download = `Anzugmanager_Export_${label}_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    closeModal();
    showToast('Export erstellt');
    markBackupDone();
}

/* ---------- backup reminder ---------- */
const LAST_BACKUP_KEY = 'anzugLastBackup_v1';
const BACKUP_DISMISS_KEY = 'anzugBackupReminderDismissed_v1';

function markBackupDone(){
    localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
    checkBackupReminder();
}

function checkBackupReminder(){
    const banner = document.getElementById('backupBanner');
    if(!banner) return;
    if(!hasSheets()){ banner.classList.remove('show'); return; }

    const lastBackupStr = localStorage.getItem(LAST_BACKUP_KEY);
    const lastBackup = lastBackupStr ? new Date(lastBackupStr) : null;
    const now = new Date();
    const daysSince = lastBackup ? Math.floor((now - lastBackup) / (1000 * 60 * 60 * 24)) : null;
    const overdue = !lastBackup || daysSince >= 3;

    if(!overdue){ banner.classList.remove('show'); return; }

    const todayStr = now.toISOString().slice(0,10);
    if(localStorage.getItem(BACKUP_DISMISS_KEY) === todayStr){ banner.classList.remove('show'); return; }

    const textEl = document.getElementById('backupBannerText');
    if(textEl){
        textEl.textContent = lastBackup
            ? `Seit ${daysSince} Tagen kein Backup erstellt. Deine Daten liegen nur lokal auf diesem Gerät.`
            : 'Noch kein Backup erstellt. Deine Daten liegen nur lokal auf diesem Gerät.';
    }
    banner.classList.add('show');
}

function exportBackup(){

        roster: loadRoster(),

    a.download = `Anzugmanager_Backup_${dateStr}.json`;

function triggerImportPicker(){
    const input = document.getElementById('backupFileInput');

function handleImportFile(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if(!data || !Array.isArray(data.sheets)) throw new Error('invalid');

            const existingSheets = JSON.parse(localStorage.getItem(DATA_KEY)) || [];
            const byId = new Map(existingSheets.map(s => [s.id, s]));
            let addedCount = 0, updatedCount = 0;
            data.sheets.forEach(s => {
                if(!s || !s.id) return;
                if(byId.has(s.id)) updatedCount++; else addedCount++;
                byId.set(s.id, s);
            });
            localStorage.setItem(DATA_KEY, JSON.stringify(Array.from(byId.values())));

            const existingRoster = loadRoster();
            const importedRoster = Array.isArray(data.roster) ? data.roster : [];
            const rosterSet = new Set(existingRoster.map(n => String(n).toLowerCase()));
            const mergedRoster = existingRoster.concat(importedRoster.filter(n => typeof n === 'string' && !rosterSet.has(n.toLowerCase())));
            mergedRoster.sort((a,b)=>a.localeCompare(b,'de'));
            saveRoster(mergedRoster);

            if(data.genderMap && typeof data.genderMap === 'object'){
                const mergedGender = Object.assign({}, data.genderMap, loadGenderMap());
                saveGenderMap(mergedGender);
            }

            closeModal();
            const parts = [];
            if(addedCount) parts.push(addedCount + ' neu');
            if(updatedCount) parts.push(updatedCount + ' aktualisiert');
            showToast(parts.length ? parts.join(', ') : 'Keine Änderungen');
            setTimeout(()=> location.reload(), 900);
        } catch(err) {
            const errEl = document.getElementById('backupErr');
            if(errEl) errEl.textContent = 'Ungültige Backup-Datei.';
            showToast('Import fehlgeschlagen');
        }
    };
    reader.readAsText(file);
    input.value = '';
}

/* ---------- sketch: freehand drawing + markers ---------- */
const sketchData = {};
let pendingMarkerCoords = null;
let pendingMarkerId = null;
let pendingClearSketchId = null;

function toggleSketchSection(id, forceHidden){
    const body = document.getElementById('sketchBody_'+id);
    const btn = document.getElementById('sketchToggle_'+id);
    const cont = document.getElementById(id);
    if(!body) return;
    const hide = forceHidden !== undefined ? forceHidden : (body.style.display !== 'none');
    body.style.display = hide ? 'none' : '';
    if(btn) btn.textContent = hide ? '+' : '−';
    if(cont) cont.dataset.sketchHidden = hide ? '1' : '0';
    if(forceHidden === undefined) save();
}

function initSketch(id){
    sketchData[id] = { color: '#e53935', mode: 'draw', strokes: [], markers: [], drawing: false, currentStroke: null };
    const canvas = document.getElementById('sketchCanvas_'+id);
    if(!canvas) return;

    const getPos = (evt) => {
        const rect = canvas.getBoundingClientRect();
        const x = (evt.clientX - rect.left) / rect.width;
        const y = (evt.clientY - rect.top) / rect.height;
        return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
    };

    canvas.addEventListener('pointerdown', (evt) => {
        const st = sketchData[id];
        const pos = getPos(evt);
        if(st.mode === 'pin'){
            openMarkerModal(id, pos, null);
            return;
        }
        st.drawing = true;
        canvas.setPointerCapture(evt.pointerId);
        st.currentStroke = { color: st.mode === 'erase' ? null : st.color, erase: st.mode === 'erase', points: [pos] };
        redrawCanvas(id);
    });
    canvas.addEventListener('pointermove', (evt) => {
        const st = sketchData[id];
        if(!st.drawing || !st.currentStroke) return;
        st.currentStroke.points.push(getPos(evt));
        redrawCanvas(id);
    });
    const endStroke = () => {
        const st = sketchData[id];
        if(!st.drawing) return;
        st.drawing = false;
        if(st.currentStroke && st.currentStroke.points.length > 1){ st.strokes.push(st.currentStroke); }
        st.currentStroke = null;
        redrawCanvas(id);
        save();
    };
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);

    redrawCanvas(id);
    renderMarkers(id);
}

function redrawCanvas(id){
    const canvas = document.getElementById('sketchCanvas_'+id);
    const st = sketchData[id];
    if(!canvas || !st) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const allStrokes = st.currentStroke ? st.strokes.concat([st.currentStroke]) : st.strokes;
    allStrokes.forEach(stroke => {
        if(!stroke.points || stroke.points.length < 2) return;
        ctx.beginPath();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        if(stroke.erase){
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 26;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = stroke.color || '#e53935';
            ctx.lineWidth = 5;
        }
        stroke.points.forEach((p, i) => {
            const x = p.x * canvas.width, y = p.y * canvas.height;
            if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';
}

function setSketchColor(id, color, btn){
    const st = sketchData[id];
    if(!st) return;
    st.color = color;
    st.mode = 'draw';
    const wrap = btn.closest('.sketch-toolbar');

function setSketchMode(id, mode){

function updateSketchModeButtons(id, mode){

        if(btn) btn.classList.toggle('active', m === mode);
    });

}

function undoSketchStroke(id){

}

        <h3>${existing ? 'Markierung bearbeiten' : 'Markierung setzen'}</h3>
        <p>Kurze Notiz, was an dieser Stelle zu tun ist.</p>
        <input type="text" id="markerNoteInput" placeholder="z. B. Naht enger nähen" value="${existing ? escapeAttrJs(existing.text) : ''}" autocomplete="off">

function escapeAttrJs(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function confirmMarker(id){
    const inp = document.getElementById('markerNoteInput');
    const text = inp.value.trim();
    if(!text){
        document.getElementById('markerErr').textContent = 'Bitte eine kurze Notiz eingeben.';
        inp.focus();
        return;
    }
    const st = sketchData[id];
    if(pendingMarkerId){
        const m = st.markers.find(mm => mm.id === pendingMarkerId);
        if(m) m.text = text;
    } else {
        const num = st.markers.length + 1;
        st.markers.push({ id: 'm'+Date.now()+Math.floor(Math.random()*1000), x: pendingMarkerCoords.x, y: pendingMarkerCoords.y, text, num });
    }
    closeModal();
    renumberMarkers(id);
    renderMarkers(id);
    save();
    pendingMarkerCoords = null;
    pendingMarkerId = null;
}

function deleteMarker(id){
    const markerId = pendingMarkerId;
    closeModal();
    const st = sketchData[id];
    if(!st || !markerId) return;
    st.markers = st.markers.filter(m => m.id !== markerId);
    renumberMarkers(id);
    renderMarkers(id);
    save();
    pendingMarkerId = null;
}

function renumberMarkers(id){
    const st = sketchData[id];
    if(!st) return;
    st.markers.forEach((m, i) => { m.num = i + 1; });
}

function makePinDraggable(pin, id, m){
    let startX = 0, startY = 0, moved = false;
    const wrap = document.getElementById('sketchWrap_'+id);

    const onMove = (evt) => {
        const rect = wrap.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (evt.clientX - rect.left) / rect.width));
        const y = Math.min(1, Math.max(0, (evt.clientY - rect.top) / rect.height));
        if(Math.abs(evt.clientX - startX) > 4 || Math.abs(evt.clientY - startY) > 4) moved = true;
        if(moved){
            pin.style.left = (x * 100) + '%';
            pin.style.top = (y * 100) + '%';
            m.x = x; m.y = y;
        }
    };
    const onUp = (evt) => {
        try{ pin.releasePointerCapture(evt.pointerId); }catch(e){}
        pin.removeEventListener('pointermove', onMove);
        pin.removeEventListener('pointerup', onUp);
        if(moved){ save(); }
        else { openMarkerModal(id, { x: m.x, y: m.y }, m.id); }
    };
    pin.addEventListener('pointerdown', (evt) => {
        evt.stopPropagation();
        evt.preventDefault();
        startX = evt.clientX; startY = evt.clientY; moved = false;
        pin.setPointerCapture(evt.pointerId);
        pin.addEventListener('pointermove', onMove);
        pin.addEventListener('pointerup', onUp);
    });
}

function renderMarkers(id){
    const st = sketchData[id];
    const pinLayer = document.getElementById('sketchPins_'+id);
    const listEl = document.getElementById('sketchMarkerList_'+id);
    if(!st || !pinLayer || !listEl) return;

    pinLayer.innerHTML = '';
    st.markers.forEach(m => {
        const pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'sketch-pin';
        pin.style.left = (m.x * 100) + '%';
        pin.style.top = (m.y * 100) + '%';
        pin.textContent = m.num;
        pin.setAttribute('aria-label', 'Markierung ' + m.num + ': ' + m.text + ' (ziehen zum Verschieben, antippen zum Bearbeiten)');
        makePinDraggable(pin, id, m);
        pinLayer.appendChild(pin);
    });

    listEl.innerHTML = '';
    if(!st.markers.length){
        listEl.innerHTML = '<div class="sketch-marker-empty">Noch keine Markierungen gesetzt.</div>';
        return;
    }
    st.markers.forEach(m => {
        const row = document.createElement('div');
        row.className = 'sketch-marker-row';
        const num = document.createElement('span');
        num.className = 'sketch-marker-num';
        num.textContent = m.num;
        const text = document.createElement('span');
        text.className = 'sketch-marker-text';
        text.textContent = m.text;
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'ri-del';
        del.setAttribute('aria-label', 'Markierung entfernen');
        del.textContent = '×';
        del.addEventListener('click', (e) => { e.stopPropagation(); pendingMarkerId = m.id; deleteMarker(id); });
        row.appendChild(num); row.appendChild(text); row.appendChild(del);
        row.addEventListener('click', () => openMarkerModal(id, { x: m.x, y: m.y }, m.id));
        listEl.appendChild(row);
    });
}

function loadSketch(id, sketch){
    if(!sketchData[id]) initSketch(id);
    const st = sketchData[id];
    st.strokes = Array.isArray(sketch.strokes) ? sketch.strokes : [];
    st.markers = Array.isArray(sketch.markers) ? sketch.markers : [];
    redrawCanvas(id);
    renderMarkers(id);
}

function formatNum(n){ return n.toFixed(1).replace('.', ','); }

function fillFromMaster(sId, kind) {
    if(kind === 'schritt') {
        const raw = document.getElementById(`master_${sId}_schritt`).value.replace(',','.');
        const v = parseFloat(raw);
        const gender = getGender(sId);
        const offset = gender === 'herren' ? 2 : -2;
        const val = isNaN(v) ? '' : formatNum(v + offset);
        document.getElementById(`k_${sId}_iB`).value = val;
        calcLR(sId, 'iB');
        document.getElementById(`k_${sId}_sO`).value = val;
        calc(sId, 'sO', 'fix', 0);
        document.getElementById(`k_${sId}_sR`).value = val;
        calc(sId, 'sR', 'fix', 0);
    } else if(kind === 'arm') {
        const raw = document.getElementById(`master_${sId}_arm`).value.replace(',','.');
        const v = parseFloat(raw);
        const target = document.getElementById(`k_${sId}_iA`);
        target.value = isNaN(v) ? '' : formatNum(v - 5);
        calcLR(sId, 'iA');
    }
}

/* ---------- calculations (unchanged logic) ---------- */
function calcLR(sId, rId) {
    const fis = parseFloat(document.getElementById(`k_${sId}_${rId}`).value.replace(',','.'));
    ['L', 'R'].forEach(side => {
        const anz = parseFloat(document.getElementById(`a_${sId}_${rId}_${side}`).value.replace(',','.'));
        const res = document.getElementById(`d_${sId}_${rId}_${side}`);
        if(isNaN(fis) || isNaN(anz)) { res.innerText = "-"; res.className = "diff-tag"; return; }
        const d = anz - fis;
        res.innerText = (d > 0 ? "+" : "") + d.toFixed(1);
        res.className = "diff-tag " + (d >= 0 ? "status-ok" : "status-bad");
    });
}

function calc(sId, rId, type, lim) {
    const kValue = document.getElementById(`k_${sId}_${rId}`).value.replace(',','.');
    const aValue = document.getElementById(`a_${sId}_${rId}`).value.replace(',','.');
    const k = parseFloat(kValue);
    const a = parseFloat(aValue);
    const res = document.getElementById(`d_${sId}_${rId}`);
    if(isNaN(k) || isNaN(a)) { res.innerText = "-"; res.className = "diff-tag"; return; }
    const d = parseFloat((a - k).toFixed(1));
    res.innerText = (d > 0 ? "+" : "") + d;
    const gender = getGender(sId);
    if(type==='fix') {
        if(rId === 'sR'){
            res.className = "diff-tag " + (d >= 0 ? "status-bad" : "status-ok");
        } else {
            res.className = "diff-tag " + (d >= 0 ? "status-ok" : "status-bad");
        }
    } else {
        let currentLim, lowerBound;
        if(gender === 'herren'){
            if(rId === 'tO' || rId === 'oS' || rId === 'kN'){
                lowerBound = 2; currentLim = 5;
            } else {
                const tr = document.querySelector(`tr[data-row-id="${rId}"]`);
                const tol = tr ? tr.dataset.tol : null;
                if(tol === '2-4'){ lowerBound = 2; currentLim = 4; }
                else if(tol === '2-5'){ lowerBound = 2; currentLim = 5; }
                else { lowerBound = 2; currentLim = 4; }
            }
        } else {
            if(rId === 'oM' || rId === 'hg'){
                lowerBound = 2; currentLim = 4;
            } else {
                lowerBound = 2; currentLim = 5;
            }
        }
        if(d < lowerBound) res.className = "diff-tag status-bad";
        else if(d < currentLim) res.className = "diff-tag status-ok";
        else if(d === currentLim) res.className = "diff-tag status-warn";
        else res.className = "diff-tag status-orange";
    }
}

function cAir(el) {
    const v = parseFloat(el.value.replace(',','.'));
    if(isNaN(v)){ el.style.background=""; el.style.color=""; el.style.borderColor=""; return; }
    el.style.background = v < 40 ? "var(--danger)" : "var(--success)";
    el.style.color = "white";
    el.style.borderColor = "transparent";
}

/* ---------- navigation ---------- */
function show(id) {
    document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
    const c = document.getElementById(id);
    if(!c) return;
    c.classList.add('active');
    currentAthleteKey = c.dataset.athleteKey;
    renderTabs();
    renderSuitBar();
}

function renderTabs(){
    const tabList = document.getElementById('tabList');
    tabList.innerHTML = '';
    const seen = new Set();
    const athletes = [];
    document.querySelectorAll('.content').forEach(c => {
        const key = c.dataset.athleteKey;
        if(!seen.has(key)){ seen.add(key); athletes.push({ key: key, name: c.dataset.athleteName }); }
    });
    athletes.forEach(a => {
        const chip = document.createElement('div');
        chip.className = 'tab-chip' + (a.key === currentAthleteKey ? ' active' : '');
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = a.name;
        btn.addEventListener('click', () => selectAthlete(a.key));
        const del = document.createElement('button');
        del.className = 'tab-del';
        del.textContent = '×';
        del.setAttribute('aria-label','Athlet löschen');
        del.addEventListener('click', (e) => { e.stopPropagation(); openDeleteAthleteModal(a.key, a.name); });
        chip.appendChild(btn); chip.appendChild(del);
        tabList.appendChild(chip);
    });
}

function selectAthlete(key){
    const sheets = document.querySelectorAll(`.content[data-athlete-key="${CSS.escape(key)}"]`);
    if(!sheets.length) return;
    const target = Array.from(sheets).find(s => s.classList.contains('active')) || sheets[0];
    show(target.id);
}

function renderSuitBar(){
    const wrap = document.getElementById('suitbarWrap');
    const list = document.getElementById('suitList');
    list.innerHTML = '';
    if(!currentAthleteKey){ wrap.style.display = 'none'; return; }
    const sheets = Array.from(document.querySelectorAll(`.content[data-athlete-key="${CSS.escape(currentAthleteKey)}"]`));
    if(!sheets.length){ wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    sheets.forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'suit-chip' + (s.classList.contains('active') ? ' active' : '');
        const btn = document.createElement('button');
        btn.className = 'suit-btn';
        btn.innerHTML = `<span class="suit-status-dot status-dot-${s.dataset.status || 'progress'}"></span>${escapeHtml(s.dataset.suit)}`;
        btn.addEventListener('click', () => show(s.id));
        chip.appendChild(btn);
        if(sheets.length > 1){
            const del = document.createElement('button');
            del.className = 'suit-del';
            del.textContent = '×';
            del.setAttribute('aria-label','Anzug entfernen');
            del.addEventListener('click', (e) => { e.stopPropagation(); openDeleteSuitModal(s.id, s.dataset.suit); });
            chip.appendChild(del);
        }
        list.appendChild(chip);
    });
    const addChip = document.createElement('button');
    addChip.type = 'button';
    addChip.className = 'suit-add';
    addChip.textContent = '+ Anzug';
    addChip.addEventListener('click', () => addSuitForCurrentAthlete());
    list.appendChild(addChip);
}

function addSuitForCurrentAthlete(){
    if(!currentAthleteKey) return;
    const sheets = document.querySelectorAll(`.content[data-athlete-key="${CSS.escape(currentAthleteKey)}"]`);
    if(!sheets.length) return;
    const name = sheets[0].dataset.athleteName;
    const gender = sheets[0].dataset.gender || getGenderFor(name) || 'damen';
    createSheet(name, null, gender, null);
}

function safeFileSegment(s){ return String(s).normalize('NFKD').replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,''); }

/* ---------- print ---------- */
function printProtocol() {
    const activeContent = document.querySelector('.content.active');
    if(!activeContent){ showToast('Kein Protokoll ausgewählt'); return; }
    window.print();
}

/* ---------- init ---------- */
if(sheets.length){ sheets.forEach(s => createSheet(s.name, s.suit || 'Anzug 1', s.gender || 'damen', s)); show(sheets[0].id); }
else { renderEmptyState(); }
checkBackupReminder();
</script>
